<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f7f2">
  <title>CampusFlow · Dashboard</title>
  <link rel="icon" href="/static/campusflow-icon.png" type="image/png">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="dashboard-page">
  <a class="skip-link" href="#main">Skip to dashboard</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="identity" href="/" aria-label="CampusFlow home">
        <img class="brand-mark" src="/static/campusflow-icon.png" width="34" height="34" alt="">
        <span class="brand">CampusFlow</span>
      </a>
      <nav class="workspaces-nav" aria-label="Workspaces">
        <a href="/">Home</a>
        <a href="/fleet">Vehicle Fleet</a>
        <a href="/resources">College Resources</a>
      </nav>
      <span class="environment">Simulation mode</span>
    </div>
  </header>

  <main id="main" class="shell dashboard">
    <header class="dashboard-heading">
      <div><p class="eyebrow" id="dashboard-area"></p><h1 id="dashboard-title">Campus operations</h1><p id="dashboard-description"></p></div>
      <div class="header-actions">
        <button type="button" class="button ghost reset" data-action="reset" disabled>Reset demo</button>
        <button type="button" class="button secondary" data-action="audit" disabled>Incident audit</button>
      </div>
    </header>
    <div id="announcements" class="screen-reader" role="status" aria-live="polite"></div>
    <div id="error" class="error" role="alert" hidden></div>
    <noscript><p class="error">Enable JavaScript to use the CampusFlow dashboard.</p></noscript>

    <nav id="subtabs" class="subtabs" aria-label="Dashboard sections"></nav>
    <div class="dashboard-grid">
      <section id="operation" aria-label="Operational state"><p class="panel">Loading dashboard…</p></section>
      <aside class="side-rail" aria-label="Shared incident and demo controls">
        <div id="console"></div>
        <section id="incident" class="incident panel" aria-label="Shared incident" hidden></section>
        <div id="activity"></div>
      </aside>
    </div>
    <footer class="site-footer"><span>MARTIAN 1.0 · Checkpoint Beta</span><span>Sample records and mock device states</span></footer>
  </main>
  <dialog id="audit-dialog" aria-labelledby="audit-title">
    <div class="dialog-top">
      <div><p class="eyebrow">Shared incident</p><h2 id="audit-title">Decision audit</h2></div>
      <form method="dialog"><button class="button secondary">Close audit</button></form>
    </div>
    <div id="audit-body"></div>
  </dialog>
</body>
</html>
