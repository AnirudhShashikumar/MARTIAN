<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#090c12" />
<meta name="mobile-web-app-capable" content="yes" />
<title>CampusFlow · C-101 Wall Appliance Panel</title>
<style>
  :root {
    --bg: #080b11;
    --surface: #111622;
    --surface-2: #182032;
    --border: rgba(255, 255, 255, 0.09);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --amber: #f59e0b;
    --emerald: #10b981;
    --sky: #38bdf8;
    --rose: #ef4444;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    user-select: none;
  }

  .panel {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    gap: 12px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* HEADER */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .room-id {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #f97316;
    color: #080b11;
    font-weight: 900;
    font-size: 13px;
    display: grid;
    place-items: center;
  }
  .room-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
  .room-sub { font-size: 11.5px; color: var(--muted); }

  .conn-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 11px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--rose); }
  .conn-pill.online .conn-dot { background: var(--emerald); }
  .conn-pill.online { border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }

  /* APPLIANCE CARDS */
  .appliances {
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  .card {
    position: relative;
    border-radius: 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    overflow: hidden;
    transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
  }

  .card-left {
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 1;
  }
  .icon-box {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: background-color 220ms var(--ease), border-color 220ms var(--ease);
  }
  .ap-name { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .ap-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .state-pill {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    border: 1px solid var(--border);
    z-index: 1;
    min-width: 96px;
    text-align: center;
    transition: all 200ms var(--ease);
  }

  /* LIGHTS ON */
  .card.lights-on {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.24), rgba(245, 158, 11, 0.08));
    border-color: rgba(251, 191, 36, 0.72);
    box-shadow: 0 0 36px rgba(251, 191, 36, 0.2);
  }
  .card.lights-on .icon-box { background: rgba(251, 191, 36, 0.22); border-color: rgba(251, 191, 36, 0.6); }
  .card.lights-on .state-pill { background: #fbbf24; color: #080b11; border-color: #fde68a; }

  /* FANS ON */
  .card.fans-on {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(56, 189, 248, 0.07));
    border-color: rgba(16, 185, 129, 0.65);
    box-shadow: 0 0 30px rgba(16, 185, 129, 0.16);
  }
  .card.fans-on .icon-box { background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.55); }
  .card.fans-on .state-pill { background: #10b981; color: #052017; border-color: #6ee7b7; }

  @keyframes spinFan {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .fan-blades { transform-origin: 24px 24px; }
  .card.fans-on .fan-blades { animation: spinFan 0.65s linear infinite; }

  /* PROJECTOR ON vs STANDBY */
  .card.proj-on {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(59, 130, 246, 0.08));
    border-color: rgba(56, 189, 248, 0.68);
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.18);
  }
  .card.proj-on .icon-box { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.55); }
  .card.proj-on .state-pill { background: #38bdf8; color: #082032; border-color: #bae6fd; }

  .card.proj-standby {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(15, 23, 42, 0.5));
    border-color: rgba(245, 158, 11, 0.55);
  }
  .card.proj-standby .state-pill { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border-color: rgba(245, 158, 11, 0.6); }

  /* PHYSICAL WALL OVERRIDE BAR */
  .override-btn {
    width: 100%;
    padding: 15px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 110ms var(--ease), background-color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .override-btn:active { transform: scale(0.98); }
  .override-btn.active {
    background: rgba(239, 68, 68, 0.18);
    border-color: rgba(239, 68, 68, 0.8);
    color: #fecaca;
  }
  .switch-pill {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
  }
  .override-btn.active .switch-pill { background: var(--rose); color: #fff; }

  /* COMMAND & ACK FOOTER */
  .ack-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 13px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .ack-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ack-badge { color: #6ee7b7; font-weight: 800; flex-shrink: 0; }

  .fs-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .card.fans-on .fan-blades { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="panel">
  <header class="top">
    <div class="room-id">
      <div class="badge">C101</div>
      <div>
        <div class="room-title">Classroom C-101</div>
        <div class="room-sub">Appliance Simulator · CampusFlow</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button class="fs-btn" id="btnFs" title="Toggle Fullscreen">⛶</button>
      <div class="conn-pill" id="connPill">
        <span class="conn-dot"></span>
        <span id="connText">CONNECTING</span>
      </div>
    </div>
  </header>

  <main class="appliances">
    <!-- LIGHTS -->
    <section class="card lights-on" id="cardLights">
      <div class="card-left">
        <div class="icon-box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icoLights" style="color:#fbbf24;">
            <path d="M9 18h6"/><path d="M10 22h4"/>
            <path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>
          </svg>
        </div>
        <div>
          <div class="ap-name">Classroom Lights</div>
          <div class="ap-meta">Tier 1 · Auto-off when unscheduled</div>
        </div>
      </div>
      <div class="state-pill" id="stateLights">ON</div>
    </section>

    <!-- CEILING FANS -->
    <section class="card fans-on" id="cardFans">
      <div class="card-left">
        <div class="icon-box">
          <svg width="38" height="38" viewBox="0 0 48 48" fill="none" id="icoFans" style="color:#34d399;">
            <g class="fan-blades">
              <path d="M24 24 C20 14, 20 6, 24 5 C28 6, 28 14, 24 24 Z" fill="currentColor" opacity="0.9"/>
              <path d="M24 24 C34 20, 42 20, 43 24 C42 28, 34 28, 24 24 Z" fill="currentColor" opacity="0.9"/>
              <path d="M24 24 C28 34, 28 42, 24 43 C20 42, 20 34, 24 24 Z" fill="currentColor" opacity="0.9"/>
              <path d="M24 24 C14 28, 6 28, 5 24 C6 20, 14 20, 24 24 Z" fill="currentColor" opacity="0.9"/>
            </g>
            <circle cx="24" cy="24" r="4.5" fill="#080b11" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <div class="ap-name">Ceiling Fans</div>
          <div class="ap-meta">Tier 1 · Auto-wake on occupancy</div>
        </div>
      </div>
      <div class="state-pill" id="stateFans">ON</div>
    </section>

    <!-- PROJECTOR -->
    <section class="card proj-on" id="cardProj">
      <div class="card-left">
        <div class="icon-box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icoProj" style="color:#38bdf8;">
            <rect x="2" y="7" width="20" height="10" rx="2"/>
            <circle cx="16" cy="12" r="3"/>
            <line x1="6" y1="10" x2="10" y2="10"/>
            <line x1="6" y1="14" x2="8" y2="14"/>
          </svg>
        </div>
        <div>
          <div class="ap-name">Projector</div>
          <div class="ap-meta">Tier 2 · Approval-gated Standby</div>
        </div>
      </div>
      <div class="state-pill" id="stateProj">ON</div>
    </section>
  </main>

  <!-- PHYSICAL WALL MANUAL OVERRIDE -->
  <button class="override-btn" id="btnOverride" type="button">
    <span>Wall Manual Override (Keep Room On)</span>
    <span class="switch-pill" id="overridePill">OFF</span>
  </button>

  <!-- LIVE COMMAND / ACK READBACK -->
  <footer class="ack-bar">
    <span class="ack-msg" id="ackMsg">Waiting for CampusFlow laptop server…</span>
    <span class="ack-badge" id="ackBadge">READY</span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  let ws = null;
  let audioCtx = null;
  let currentDevices = { Lights: 'On', Fans: 'On', Projector: 'On' };
  let wallOverride = false;

  function playRelayClick(isOff) {
    try {
      if (navigator.vibrate) navigator.vibrate(isOff ? [35, 30, 35] : 50);
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(isOff ? 420 : 760, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.085);
    } catch (_) {}
  }

  function applyDevices(devices, animateFeedback = false) {
    const changed = JSON.stringify(devices) !== JSON.stringify(currentDevices);
    currentDevices = { ...devices };

    // Lights
    const lOn = devices.Lights === 'On';
    document.getElementById('cardLights').className = 'card' + (lOn ? ' lights-on' : '');
    document.getElementById('icoLights').style.color = lOn ? '#fbbf24' : '#64748b';
    document.getElementById('stateLights').textContent = lOn ? 'ON' : 'OFF';

    // Fans
    const fOn = devices.Fans === 'On';
    document.getElementById('cardFans').className = 'card' + (fOn ? ' fans-on' : '');
    document.getElementById('icoFans').style.color = fOn ? '#34d399' : '#64748b';
    document.getElementById('stateFans').textContent = fOn ? 'ON' : 'OFF';

    // Projector
    const pState = devices.Projector;
    const cardP = document.getElementById('cardProj');
    cardP.className = 'card' + (pState === 'On' ? ' proj-on' : (pState === 'Standby' ? ' proj-standby' : ''));
    document.getElementById('icoProj').style.color = pState === 'On' ? '#38bdf8' : (pState === 'Standby' ? '#f59e0b' : '#64748b');
    document.getElementById('stateProj').textContent = pState.toUpperCase();

    if (animateFeedback && changed) {
      playRelayClick(!lOn && !fOn);
    }
  }

  function applyOverride(active) {
    wallOverride = !!active;
    const btn = document.getElementById('btnOverride');
    btn.className = 'override-btn' + (wallOverride ? ' active' : '');
    document.getElementById('overridePill').textContent = wallOverride ? 'LOCKED ON' : 'OFF';
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws/room-panel?role=phone`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      document.getElementById('connPill').className = 'conn-pill online';
      document.getElementById('connText').textContent = 'LIVE WS';
      document.getElementById('ackMsg').textContent = 'Connected to CampusFlow server';
    };

    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'snapshot') {
        applyDevices(msg.state.devices, false);
        applyOverride(msg.state.wall_override);
        document.getElementById('ackMsg').textContent = msg.state.status_detail;
      } else if (msg.type === 'command') {
        applyDevices(msg.devices, true);
        // Send immediate closed-loop ACK back to FastAPI!
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'ack',
            cmd_id: msg.cmd_id,
            room: msg.room,
            devices: currentDevices
          }));
        }
        document.getElementById('ackMsg').textContent = `${msg.cmd_id}: ${msg.reason}`;
        document.getElementById('ackBadge').textContent = 'ACK SENT ✓';
      }
    };

    ws.onclose = () => {
      document.getElementById('connPill').className = 'conn-pill';
      document.getElementById('connText').textContent = 'RECONNECTING';
      setTimeout(connect, 1000);
    };
  }

  document.getElementById('btnOverride').addEventListener('click', () => {
    const next = !wallOverride;
    applyOverride(next);
    playRelayClick(false);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'wall_override', room: 'C-101', active: next }));
      document.getElementById('ackMsg').textContent = next
        ? 'Wall override ON — sent fail-safe hold to laptop'
        : 'Wall override released — resumed live agent';
    }
  });

  document.getElementById('btnFs').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  });

  connect();
})();
</script>
</body>
</html>
